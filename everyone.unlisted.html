<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הימורי בחירות 2026 - כולם</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --text:#1c2333; --muted:#6b7491; --accent:#3b6df0; --track:#e6eaf5; --gold:#f5b301; --silver:#9aa4b2; --bronze:#c97b3d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10141f; --card:#1a2030; --text:#e8ecf6; --muted:#8f9ab8; --accent:#6f95ff; --track:#27304a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 40px; }
  h1 { margin:0 0 4px; font-size:1.6rem; }
  .group { color:var(--accent); font-weight:600; margin-bottom:12px; }
  .meta { color:var(--muted); font-size:.85rem; line-height:1.5; }
  .gov { margin:14px 0 18px; padding:10px 14px; background:var(--card); border-radius:12px; font-size:.95rem; }
  ol { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
  li { background:var(--card); border-radius:14px; padding:12px 14px; display:grid; grid-template-columns:2.4rem 1fr auto; align-items:center; gap:4px 10px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .rank { font-size:1.5rem; text-align:center; font-weight:700; color:var(--muted); }
  .name { font-weight:600; font-size:1.05rem; }
  .err { font-weight:700; font-variant-numeric:tabular-nums; }
  .bar { grid-column:2 / 4; height:6px; background:var(--track); border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); border-radius:3px; }
  li.r1 .bar i { background:var(--gold); } li.r2 .bar i { background:var(--silver); } li.r3 .bar i { background:var(--bronze); }
  .l1 { grid-column:2 / 4; color:var(--muted); font-size:.8rem; }
  .foot { margin-top:18px; color:var(--muted); font-size:.75rem; text-align:center; }
  .toggle { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:.85rem; margin-bottom:10px; cursor:pointer; width:fit-content; }
  li.msg { display:block; text-align:center; color:var(--muted); padding:30px 0; }
</style>
</head>
<body>
<main>
  <h1>🗳️ הימורי בחירות 2026</h1>
  <div class="group">כולם</div>
  <div class="meta" id="meta"></div>
  <div class="gov" id="gov" hidden></div>
  <label class="toggle"><input type="checkbox" id="showPolls" checked> הצג סקרים</label>
  <ol id="list"><li class="msg">טוען…</li></ol>
  <div class="foot">שגיאה נמוכה יותר = ניחוש קרוב יותר לסקרים</div>
</main>
<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSZ7vajSnuLmhXXagQpwfXD3Je8pMH2_lGgCfjZoeBQv4hNehmCxNQDTNqDPmD2lrhk9978m0JIU4Bd/pub?gid=1070308260&single=true&output=csv";

function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

const MEDALS = ["🥇", "🥈", "🥉"];
const $ = id => document.getElementById(id);

let allRows = [];

function render() {
  const rows = $("showPolls").checked ? allRows : allRows.filter(p => !p.poll);
  const max = Math.max(...rows.map(p => p.err));
  let place = 0;
  $("list").innerHTML = rows.map(p => {
    const m = p.poll ? -1 : place++;
    return `
      <li class="${m >= 0 && m < 3 ? "r" + (m + 1) : ""}">
        <div class="rank">${MEDALS[m] || p.rank}</div>
        <div class="name"></div>
        <div class="err">${p.err.toFixed(2)}</div>
        <div class="bar"><i style="width:${Math.max(4, (p.err / max) * 100)}%"></i></div>
        <div class="l1">סטייה כוללת: ${p.l1}</div>
      </li>`;
  }).join("");
  document.querySelectorAll(".name").forEach((el, i) => el.textContent = rows[i].name);
}

async function load() {
  try {
    const res = await fetch(CSV_URL, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const rows = parseCSV(await res.text());
    $("meta").textContent = rows[1]?.[1] || "";
    if (rows[2]?.[1]) { $("gov").textContent = rows[2][1]; $("gov").hidden = false; }
    allRows = rows.slice(4).filter(r => r[2] && r[1] && !isNaN(parseFloat(r[3])))
      .map(r => ({ rank: r[1], name: r[2], err: parseFloat(r[3]), l1: r[4], poll: isNaN(parseInt(r[1])) }));
    render();
    $("showPolls").addEventListener("change", render);
  } catch (e) {
    $("list").innerHTML = '<li class="msg">לא הצלחנו לטעון את הנתונים. נסו לרענן.</li>';
  }
}
load();
</script>
</body>
</html>
